<html lang="ar" dir="rtl">

    <title>مكتب أبو محمد | استشارات وتصاريح الزواج في السعودية</title>

    <!-- ========================================================= -->
    <!-- Content Security Policy (CSP) للسماح بتشغيل اعلانات وجوجل تاج منجر (GTM) -->
    <!-- يحل مشكلة "الموارد المحظورة" في تتبع وجوجل ادس والتحليلات -->
    <!-- ========================================================= -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://adservice.google.com https://pagead2.googlesyndication.com; img-src 'self' data: blob: https: https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.sa https://pagead2.googlesyndication.com; connect-src 'self' https: https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://www.google.sa https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.doubleclick.net; frame-src 'self' https://www.googletagmanager.com https://bid.g.doubleclick.net https://td.doubleclick.net https://googleads.g.doubleclick.net; child-src 'self' https://www.googletagmanager.com https://bid.g.doubleclick.net https://td.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- ========================================================= -->
    <!-- 1) Google Tag Manager (GTM) - ضع كود تاج منجر هنا داخل <head> -->
    <!-- استبدل GTM-XXXXXXX بمعرف الحاوية الخاص بك من Google Tag Manager -->
    <!--
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    -->
    <!-- ========================================================= -->

    <!-- ========================================================= -->
    <!-- 2) Google Ads Tag (gtag.js) - إذا كنت تستخدم إعلانات جوجل مباشرة بدون GTM -->
    <!-- استبدل AW-XXXXXXXXX بمعرف حساب إعلانات جوجل الخاص بك -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-XXXXXXXXX');
    </script>
    -->
    <!-- ========================================================= -->
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Tajawal','Cairo',sans-serif]">
    <!-- ========================================================= -->
    <!-- Google Tag Manager (noscript) - يوضع فوراً بعد فتح tag <body> -->
    <!-- استبدل GTM-XXXXXXX بمعرف GTM الخاص بك -->
    <!--
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    -->
    <!-- ========================================================= -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
